<svg xmlns="http://www.w3.org/2000/svg" width="880" height="156" viewBox="0 0 880 156" role="img" aria-label="I&#8217;m Angelito P. Decatoria III, but most people call me Thirdy. I&#8217;m a full-stack software engineer and Computer Science graduate from Cavite State University, and I build web, mobile and AI products people can rely on.

Lately I&#8217;ve been building open-source developer tools: Vedit, an AI video editor that cuts the pauses and bad takes out of talking-head footage, and CommitGen, a CLI that writes your commit messages from the staged diff.

When I&#8217;m not coding, you&#8217;ll probably find me playing Valorant or exploring new technologies."><style>@font-face{font-family:GA;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:GB;src:url(data:font/woff2;base64,) format("woff2")}.r{font:400 14.5px GA,sans-serif;fill:#1f2328}.b{font:500 14.5px GB,sans-serif;fill:#1f2328}</style><text x="0" y="17" xml:space="preserve"><tspan class="r">I&#8217;m </tspan><tspan class="b">Angelito P. Decatoria III</tspan><tspan class="r">, but most people call me </tspan><tspan class="b">Thirdy</tspan><tspan class="r">. I&#8217;m a full-stack software engineer and Computer Science graduate </tspan></text><text x="0" y="41" xml:space="preserve"><tspan class="r">from Cavite State University, and I build web, mobile and AI products people can rely on.</tspan></text><text x="0" y="79" xml:space="preserve"><tspan class="r">Lately I&#8217;ve been building open-source developer tools: </tspan><tspan class="b">Vedit</tspan><tspan class="r">, an AI video editor that cuts the pauses and bad takes out of </tspan></text><text x="0" y="103" xml:space="preserve"><tspan class="r">talking-head footage, and </tspan><tspan class="b">CommitGen</tspan><tspan class="r">, a CLI that writes your commit messages from the staged diff.</tspan></text><text x="0" y="141" xml:space="preserve"><tspan class="r">When I&#8217;m not coding, you&#8217;ll probably find me playing Valorant or exploring new technologies.</tspan></text></svg>